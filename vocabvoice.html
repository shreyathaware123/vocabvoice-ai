<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocabVoice — learn a word by saying it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAF0F4;
    --surface: #FFFFFF;
    --ink: #1B2A4A;
    --ink-soft: #55647E;
    --teal: #2F6F6B;
    --teal-soft: #E3EFEE;
    --gold: #C99A3E;
    --brick: #B5483D;
    --brick-soft: #F7E9E7;
    --border: #D6DEE6;
    --font-serif: 'Source Serif 4', Georgia, serif;
    --font-sans: 'Inter', -apple-system, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(47,111,107,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,154,62,0.08), transparent 40%);
    font-family: var(--font-sans);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .app{
    width: 100%;
    max-width: 460px;
  }

  .topbar{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .brand{
    font-family: var(--font-serif);
    font-size: 20px;
    font-style: italic;
    font-weight: 600;
    color: var(--ink);
  }

  .score{
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 30px;
    box-shadow: 0 1px 2px rgba(27,42,74,0.04), 0 12px 32px rgba(27,42,74,0.07);
    min-height: 360px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- start screen ---------- */
  .start-screen{
    margin: auto 0;
    text-align: center;
  }
  .start-screen h1{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 10px;
  }
  .start-screen p{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.55;
    margin: 0 0 26px;
    max-width: 34ch;
    margin-left: auto;
    margin-right: auto;
  }

  button{
    font-family: var(--font-sans);
    cursor: pointer;
    border: none;
  }

  .btn-primary{
    background: var(--ink);
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 26px;
    border-radius: 12px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover{ background: #142038; }
  .btn-primary:active{ transform: scale(0.97); }

  .btn-text{
    background: transparent;
    color: var(--ink-soft);
    font-size: 13.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px;
  }
  .btn-text:hover{ color: var(--ink); }

  /* ---------- word / prompt screen ---------- */
  .pos{
    font-size: 12.5px;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .word{
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .definition{
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16.5px;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .instruction{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .mic-zone{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: auto;
  }

  .mic-ring{
    position: relative;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-ring::before{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--teal);
    opacity: 0.15;
    transform: scale(1);
  }
  .mic-ring.listening::before{
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform: scale(0.9); opacity: 0.35; }
    70%{ transform: scale(1.55); opacity: 0; }
    100%{ transform: scale(1.55); opacity: 0; }
  }

  .mic-btn{
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--teal);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(47,111,107,0.35);
    transition: transform 0.15s ease;
  }
  .mic-btn:hover{ transform: scale(1.05); }
  .mic-btn:active{ transform: scale(0.95); }
  .mic-btn.listening{ background: var(--brick); box-shadow: 0 6px 16px rgba(181,72,61,0.35); }
  .mic-btn svg{ width: 26px; height: 26px; }

  .mic-label{
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
    text-align: center;
  }

  .transcript{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    text-align: center;
    min-height: 22px;
    padding: 0 8px;
  }

  .type-fallback{
    display: flex;
    gap: 8px;
    margin-top: 4px;
    width: 100%;
  }
  .type-fallback input{
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink);
  }
  .type-fallback input:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .type-fallback button{
    background: var(--ink);
    color: white;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 13.5px;
    font-weight: 600;
  }

  .support-note{
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 4px;
  }

  /* ---------- thinking ---------- */
  .thinking{
    margin: auto 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .dots span{
    display: inline-block;
    width: 6px; height: 6px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: 0.15s; }
  .dots span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 80%, 100%{ transform: translateY(0); opacity: 0.5; }
    40%{ transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- feedback ---------- */
  .feedback{
    margin: auto 0;
    animation: fadein 0.35s ease;
  }
  @keyframes fadein{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .verdict{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .verdict-icon{
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .verdict-icon.correct{ background: var(--teal-soft); color: var(--teal); }
  .verdict-icon.incorrect{ background: var(--brick-soft); color: var(--brick); }
  .verdict-title{
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 18px;
  }

  .said-it{
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .said-it b{ color: var(--ink); font-weight: 600; }

  .feedback-text{
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 18px;
  }

  .example-block{
    border-left: 3px solid var(--gold);
    padding: 4px 0 4px 14px;
    margin-bottom: 26px;
  }
  .example-label{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }
  .example-sentence{
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 14.5px;
    color: var(--ink);
  }

  .error-box{
    font-size: 13.5px;
    color: var(--brick);
    background: var(--brick-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  footer{
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">VocabVoice</div>
    <div class="score" id="score">Score 0 · Word 0 of 10</div>
  </div>

  <div class="card" id="card"></div>

  <footer>Speak or type a sentence using the word — your tutor listens either way.</footer>
</div>

<script>
(function(){

  const WORDS = [
    { word: "ephemeral", pos: "adjective", def: "lasting for a very short time", example: "Fame on social media can be ephemeral, gone again within a week." },
    { word: "meticulous", pos: "adjective", def: "showing great care and attention to detail", example: "She was meticulous about checking every number in the report." },
    { word: "resilient", pos: "adjective", def: "able to recover quickly from difficulty", example: "The team stayed resilient even after losing the first three matches." },
    { word: "candid", pos: "adjective", def: "truthful and straightforward; not hiding anything", example: "He gave a candid answer about what had gone wrong in the project." },
    { word: "eloquent", pos: "adjective", def: "fluent and persuasive in speaking or writing", example: "Her eloquent speech left the entire room in silence." },
    { word: "pragmatic", pos: "adjective", def: "dealing with things in a sensible, practical way", example: "We need a pragmatic plan, not just a list of ideas." },
    { word: "tenacious", pos: "adjective", def: "holding firmly to something; not easily giving up", example: "Her tenacious approach to the job hunt finally paid off." },
    { word: "versatile", pos: "adjective", def: "able to adapt to many different uses or situations", example: "Excel is a versatile tool used across almost every industry." },
    { word: "subtle", pos: "adjective", def: "not obvious; delicate or precise", example: "There was a subtle shift in tone once the client joined the call." },
    { word: "ambiguous", pos: "adjective", def: "open to more than one interpretation", example: "The instructions were ambiguous, so everyone interpreted them differently." },
    { word: "diligent", pos: "adjective", def: "showing steady, careful effort in one's work", example: "He was diligent about double-checking his SQL queries before sharing them." },
    { word: "skeptical", pos: "adjective", def: "not easily convinced; having doubts", example: "I was skeptical about the new tool until I tried it myself." }
  ];

  const TOTAL_ROUNDS = 10;
  let deck = shuffle([...WORDS]).slice(0, TOTAL_ROUNDS);
  let round = 0;
  let score = 0;
  let currentWord = null;
  let recognition = null;
  let listening = false;

  const card = document.getElementById('card');
  const scoreEl = document.getElementById('score');

  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hasSTT = !!SpeechRecognitionAPI;
  const hasTTS = 'speechSynthesis' in window;

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function speak(text){
    if(!hasTTS) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.98;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }

  function updateScore(){
    scoreEl.textContent = `Score ${score} · Word ${Math.min(round, TOTAL_ROUNDS)} of ${TOTAL_ROUNDS}`;
  }

  function renderStart(){
    card.innerHTML = `
      <div class="start-screen">
        <h1>Say it to learn it</h1>
        <p>I'll give you a word and its meaning. Say it out loud in a sentence, and I'll tell you — out loud — whether you used it right.</p>
        <button class="btn-primary" id="startBtn">Start practicing</button>
      </div>
    `;
    document.getElementById('startBtn').addEventListener('click', nextWord);
  }

  function nextWord(){
    if(round >= TOTAL_ROUNDS){
      renderComplete();
      return;
    }
    currentWord = deck[round];
    round++;
    updateScore();
    renderPrompt();
    speak(`Your word is ${currentWord.word}. It means: ${currentWord.def}. Try using it in a sentence.`);
  }

  function renderPrompt(){
    card.innerHTML = `
      <div>
        <div class="pos">${currentWord.pos}</div>
        <div class="word">${currentWord.word}</div>
        <div class="definition">${currentWord.def}</div>
        <div class="instruction">Use "${currentWord.word}" correctly in a sentence.</div>
      </div>
      <div class="mic-zone">
        <div class="mic-ring" id="micRing">
          <button class="mic-btn" id="micBtn" aria-label="Tap to speak your sentence" ${hasSTT ? '' : 'disabled'}>
            ${micIcon()}
          </button>
        </div>
        <div class="mic-label" id="micLabel">${hasSTT ? 'Tap to speak' : 'Voice input not supported here — type instead'}</div>
        <div class="transcript" id="transcriptEl" aria-live="polite"></div>
        <div class="type-fallback">
          <input type="text" id="typeInput" placeholder="Or type your sentence…" />
          <button id="typeSubmit">Check</button>
        </div>
        ${!hasTTS ? '<div class="support-note">Voice playback not supported in this browser — reading text only.</div>' : ''}
      </div>
    `;

    if(hasSTT){
      document.getElementById('micBtn').addEventListener('click', toggleListening);
    }
    document.getElementById('typeSubmit').addEventListener('click', () => {
      const val = document.getElementById('typeInput').value.trim();
      if(val) submitAnswer(val);
    });
    document.getElementById('typeInput').addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        const val = e.target.value.trim();
        if(val) submitAnswer(val);
      }
    });
  }

  function micIcon(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>`;
  }

  function toggleListening(){
    if(listening){
      recognition && recognition.stop();
      return;
    }
    startListening();
  }

  function startListening(){
    if(!hasSTT) return;
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    const micBtn = document.getElementById('micBtn');
    const micRing = document.getElementById('micRing');
    const micLabel = document.getElementById('micLabel');
    const transcriptEl = document.getElementById('transcriptEl');

    listening = true;
    micBtn.classList.add('listening');
    micRing.classList.add('listening');
    micLabel.textContent = 'Listening… tap again to stop';

    let finalTranscript = '';

    recognition.onresult = (event) => {
      let interim = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const t = event.results[i][0].transcript;
        if(event.results[i].isFinal){
          finalTranscript += t;
        } else {
          interim += t;
        }
      }
      transcriptEl.textContent = finalTranscript || interim;
    };

    recognition.onerror = (event) => {
      listening = false;
      micBtn.classList.remove('listening');
      micRing.classList.remove('listening');
      micLabel.textContent = event.error === 'not-allowed'
        ? 'Microphone permission blocked — try typing instead'
        : 'Didn\'t catch that — tap to try again';
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      micRing.classList.remove('listening');
      if(finalTranscript.trim()){
        submitAnswer(finalTranscript.trim());
      } else {
        micLabel.textContent = 'Tap to speak';
      }
    };

    recognition.start();
  }

  function submitAnswer(sentence){
    renderThinking(sentence);
    // small delay so the "checking" state is visible — mirrors a real grading pause
    setTimeout(() => {
      const result = judgeSentence(currentWord, sentence);
      if(result.correct) score++;
      updateScore();
      renderFeedback(sentence, result);
      speak(result.feedback);
    }, 650);
  }

  function renderThinking(sentence){
    card.innerHTML = `
      <div class="thinking">
        <div style="margin-bottom:10px;">Checking your sentence…</div>
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="said-it" style="margin-top:22px;">You said: <b>"${escapeHtml(sentence)}"</b></div>
      </div>
    `;
  }

  const GOOD_FEEDBACK = [
    "Nice work — that's exactly how {word} is meant to be used.",
    "That lands well. You've clearly got the feel for {word} now.",
    "Good usage — the meaning of {word} comes through clearly there.",
    "That's a solid sentence. {word} fits naturally in it."
  ];
  const RETRY_FEEDBACK = [
    "Close, but let's make sure {word} carries its full meaning — have a look at the example below.",
    "Not quite there yet — try leaning more into what {word} actually means.",
    "Good attempt, but the sentence doesn't quite show the meaning of {word} yet.",
    "Almost — {word} needs a bit more context to land correctly. Here's an example."
  ];

  function judgeSentence(wordObj, sentence){
    const normalizedSentence = sentence.toLowerCase();
    const wordPattern = new RegExp('\\b' + wordObj.word.toLowerCase() + '\\b');
    const usesWord = wordPattern.test(normalizedSentence);
    const wordCount = sentence.trim().split(/\s+/).filter(Boolean).length;
    const isSentenceLength = wordCount >= 4;

    const correct = usesWord && isSentenceLength;
    const pool = correct ? GOOD_FEEDBACK : RETRY_FEEDBACK;
    const template = pool[Math.floor(Math.random() * pool.length)];
    const feedback = template.replace('{word}', wordObj.word);

    return {
      correct,
      feedback,
      exampleSentence: wordObj.example
    };
  }

  function renderFeedback(sentence, result){
    const isCorrect = !!result.correct;
    card.innerHTML = `
      <div class="feedback">
        <div class="verdict">
          <div class="verdict-icon ${isCorrect ? 'correct' : 'incorrect'}">
            ${isCorrect ? checkIcon() : crossIcon()}
          </div>
          <div class="verdict-title">${isCorrect ? 'Nice — that works' : 'Not quite there yet'}</div>
        </div>
        <div class="said-it">You said: <b>"${escapeHtml(sentence)}"</b></div>
        <div class="feedback-text">${escapeHtml(result.feedback || '')}</div>
        ${result.exampleSentence ? `
          <div class="example-block">
            <div class="example-label">Another way to use it</div>
            <div class="example-sentence">${escapeHtml(result.exampleSentence)}</div>
          </div>
        ` : ''}
        <button class="btn-primary" id="nextBtn" style="align-self:flex-start;">
          ${round >= TOTAL_ROUNDS ? 'See results' : 'Next word'}
        </button>
      </div>
    `;
    document.getElementById('nextBtn').addEventListener('click', nextWord);
  }

  function renderErrorFeedback(sentence, err){
    card.innerHTML = `
      <div class="feedback">
        <div class="said-it">You said: <b>"${escapeHtml(sentence)}"</b></div>
        <div class="error-box">Couldn't reach the tutor to grade this one — ${escapeHtml(err.message || 'please try again')}.</div>
        <button class="btn-primary" id="retryBtn" style="align-self:flex-start;">Try next word</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', nextWord);
  }

  function renderComplete(){
    card.innerHTML = `
      <div class="start-screen">
        <h1>${score} / ${TOTAL_ROUNDS}</h1>
        <p>That's one full round. Want to go again with a fresh shuffle of words?</p>
        <button class="btn-primary" id="restartBtn">Practice again</button>
      </div>
    `;
    document.getElementById('restartBtn').addEventListener('click', () => {
      deck = shuffle([...WORDS]).slice(0, TOTAL_ROUNDS);
      round = 0;
      score = 0;
      updateScore();
      nextWord();
    });
  }

  function checkIcon(){
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
  }
  function crossIcon(){
    return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  updateScore();
  renderStart();
})();
</script>
</body>
</html>
